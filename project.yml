name: JuicyMac
options:
  bundleIdPrefix: com.kovalskyi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: SHFR8S4R37
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  JuicyKit:
    path: JuicyKit

targets:
  JuicyMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Helper/com.kovalskyi.JuicyMac.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: JuicyKit
        products: [JuicyCore, JuicySystem, JuicyHelperKit]
      - target: JuicyMacHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovalskyi.JuicyMac
        PRODUCT_NAME: Juicy Mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/JuicyMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  JuicyMacHelper:
    type: tool
    platform: macOS
    sources: [Helper/main.swift]
    dependencies:
      - package: JuicyKit
        products: [JuicyHelperKit, JuicySystem]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kovalskyi.JuicyMac.Helper
        PRODUCT_NAME: JuicyMacHelper
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: Helper/Info.plist
        INFOPLIST_KEY_JMTeamIdentifier: SHFR8S4R37
        SKIP_INSTALL: YES
